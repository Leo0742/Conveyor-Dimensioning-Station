name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Smoke-test README commands
        run: |
          rm -rf /tmp/conveyor-smoke
          uv run conveyor-dimensioning demo --output-dir /tmp/conveyor-smoke --seed 42
          uv run conveyor-dimensioning measure /tmp/conveyor-smoke/sample_scene.npz \
            --item-id synthetic-check --seed 42 > /tmp/conveyor-smoke/measure.json
          uv run conveyor-dimensioning sensor-benchmark \
            --output-dir /tmp/conveyor-smoke --seed 42
          uv run conveyor-dimensioning monte-carlo \
            --output-dir /tmp/conveyor-smoke --count 500 --seed 20261017
          uv run conveyor-dimensioning multiframe-demo \
            --output-dir /tmp/conveyor-smoke --seed 42
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/conveyor-smoke')
          required = [
              'measurement.png',
              'conveyor_demo.gif',
              'sample_scene.npz',
              'sensor_benchmark_metrics.json',
              'monte_carlo_metrics.json',
              'multiframe_wms.json',
              'measure.json',
          ]
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              raise SystemExit(f'missing smoke-test outputs: {missing}')
          payload = json.loads((root / 'measure.json').read_text())
          if payload.get('measurement_status') != 'ok':
              raise SystemExit(f'unexpected measurement status: {payload}')
          PY

  open3d-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install optional Open3D dependencies
        run: uv sync --frozen --python 3.12 --extra open3d
      - name: Run full test suite with Open3D
        run: uv run pytest -q
      - name: Run Open3D comparison script
        run: |
          uv run python scripts/compare_obb.py --output /tmp/obb_comparison.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/obb_comparison.json')
          rows = json.loads(path.read_text())
          if len(rows) != 6:
              raise SystemExit(f'expected 6 OBB comparison rows, got {len(rows)}')
          required = {
              'shape',
              'custom_dimensions_mm',
              'reference_dimensions_mm',
              'reference_method',
              'open3d_version',
          }
          for row in rows:
              missing = required - row.keys()
              if missing:
                  raise SystemExit(f'missing OBB comparison fields: {sorted(missing)}')
          print('Open3D comparison verified for:', ', '.join(row['shape'] for row in rows))
          print('Open3D version:', rows[0]['open3d_version'])
          print('Reference method:', rows[0]['reference_method'])
          PY
